<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FocusFlow - Pomodoro Timer</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app">

        <header>

            <div>

                <h1> FocusFlow</h1>

                <p>
                    Focus better. Work smarter.
                </p>

            </div>

            <button
                id="themeBtn"
                class="theme-btn"
            >
                🌙
            </button>

        </header>


        <section class="timer-card">

            <div class="mode">

                <button
                    id="focusBtn"
                    class="mode-btn active"
                >
                    Focus
                </button>

                <button
                    id="breakBtn"
                    class="mode-btn"
                >
                    Break
                </button>

            </div>


            <div
                id="timer"
                class="timer"
            >
                25:00
            </div>


            <p
                id="status"
                class="status"
            >
                Time to focus
            </p>


            <div class="controls">

                <button
                    id="startBtn"
                    class="primary"
                >
                    ▶ Start
                </button>

                <button
                    id="pauseBtn"
                    class="secondary"
                >
                    ⏸ Pause
                </button>

                <button
                    id="resetBtn"
                    class="secondary"
                >
                    🔄 Reset
                </button>

                <button
                    id="skipBtn"
                    class="secondary"
                >
                    ⏭ Skip
                </button>

            </div>

        </section>


        <section class="stats">

            <div class="stat-card">

                <span>Completed Sessions</span>

                <strong id="sessions">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>Current Mode</span>

                <strong id="currentMode">
                    Focus
                </strong>

            </div>


            <div class="stat-card">

                <span>Next Break</span>

                <strong>
                    5 min
                </strong>

            </div>

        </section>


        <section class="info">

            <h2>
                How it works
            </h2>

            <p>
                Work for 25 minutes, then take
                a 5-minute break. Repeat and
                stay focused.
            </p>

        </section>


        <footer>

            Built with HTML, CSS & JavaScript

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
